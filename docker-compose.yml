name: csvgate
services:
  app:
    build: .
    container_name: csvgate-app
    ports: ["${APP_PORT:-18212}:8000"]
    environment:
      - APP_PORT=${APP_PORT:-18212}
      - CSVGATE_DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - csvgate-data:/app/data
volumes:
  csvgate-data:
